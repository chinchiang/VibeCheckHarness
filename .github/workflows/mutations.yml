name: mutations

# Every mutation list, once a week and on demand (2026-11-22 review E10). A pull request runs only the lists it touched
# (validate.yml, job `mutations`); a change to a mutated source file that keeps every anchor intact is caught here.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-lists:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Run every mutation list (shard ${{ matrix.shard }} of 4)
        shell: bash
        run: |
          python tools/changed_mutation_lists.py --all | awk -v s="$SHARD" 'NR % 4 == s' > lists.txt
          cat lists.txt
          xargs -r -P 4 -n 1 python tools/mutation_check.py < lists.txt
