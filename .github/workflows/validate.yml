name: validate

# A push to a pull-request branch used to start two identical runs (push and pull_request). Pushes now run only on
# main; every other branch is checked through its pull request.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request (or to main) cancels the run still in progress.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # --require-hashes: pip refuses a file whose sha256 is not in the lock (tools/lock_hashes.py, docs/09 BL-57)
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Development tools (parallel tests; not validator dependencies)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Every pinned requirement carries a hash
        run: python tools/lock_hashes.py --check requirements.lock requirements-dev.txt
      - run: python tools/validate_schemas.py
      - run: python -m pytest -q -n auto tests
      - run: python tools/check_doc_links.py
      - name: Generated evidence ledger is up to date
        run: python tools/build_evidence_ledger.py --check
      - name: Generated references are up to date
        run: python tools/build_references.py --check
      - name: Error-code table matches the validator
        run: python tools/build_error_table.py --check
      - name: Variant bundles are up to date and validate cleanly
        run: python tools/build_variants.py --check
      - name: Mutation anchors still match the source
        run: python tools/mutation_check.py --anchors-only tests/mutations/*.json
        shell: bash

  # Lint and coverage run once, not on every matrix cell. They are separate jobs so the lint result arrives in under a
  # minute instead of waiting for the tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint (syntax errors and pyflakes; pyproject.toml [tool.ruff])
        run: python -m ruff check tools tests

  # The coverage report is informational; no threshold is enforced yet. COVERAGE_CORE=sysmon (coverage.py on
  # Python 3.12+, sys.monitoring) measures line coverage at almost no cost: locally the 2059 tests take 5m36s with it and
  # 5m33s without coverage, against more than 10 minutes with the default tracer (34 minutes on the CI runner). Both
  # tracers report the same figure.
  coverage:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Coverage of tools/vchlib (report only)
        run: python -m pytest -q -n auto --cov=tools/vchlib --cov-report=term tests

  # The mutation lists a pull request touched are run, not only anchor-checked (2026-11-22 review E10): a list whose
  # tests catch nothing used to pass CI. Lists the change did not touch run in the weekly workflow (mutations.yml).
  mutations:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      BASE_REF: ${{ github.base_ref }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Run the mutation lists this pull request touched (shard ${{ matrix.shard }} of 4)
        shell: bash
        run: |
          python tools/changed_mutation_lists.py "origin/$BASE_REF" | awk -v s="$SHARD" 'NR % 4 == s' > lists.txt
          cat lists.txt
          xargs -r -P 4 -n 1 python tools/mutation_check.py < lists.txt
