name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python tools/validate_schemas.py
      - run: python -m pytest -q tests
      - run: python tools/check_doc_links.py
      - name: Generated evidence ledger is up to date
        run: python tools/build_evidence_ledger.py --check
      - name: Generated references are up to date
        run: python tools/build_references.py --check
      - name: Error-code table matches the validator
        run: python tools/build_error_table.py --check
      - name: Variant bundles are up to date and validate cleanly
        run: python tools/build_variants.py --check
      - name: Mutation anchors still match the source
        run: python tools/mutation_check.py --anchors-only tests/mutations/*.json
        shell: bash
