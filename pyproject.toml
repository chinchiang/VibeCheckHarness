[project]
name = "vibecheck-harness-design"
version = "0.5.0"
description = "VibeCheck Harness design repo: schemas, examples and the example validator (tools/vchlib)"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
  "cryptography>=43",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# CI and local development only (requirements-dev.txt pins the same versions). Not validator dependencies: they are not in
# requirements.txt, so docs/examples/licenses.yaml (pinned by the signed engagement) does not list them.
dev = ["pytest-xdist==3.8.0", "pytest-cov==7.1.0", "ruff==0.17.6"]
reference = ["rfc8785==0.1.4"]   # RFC 8785 cross-check only; the validator warns (W-JCS-REFERENCE-MISSING) without it (r12 PR6)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 160          # not enforced (no E501): the code base uses long lines; no formatter is applied

[tool.ruff.lint]
# Syntax errors and pyflakes only: unused imports / variables, undefined names, shadowed imports. Style rules and a
# formatter would rewrite most files at once and move the mutation anchors (tests/mutations/*.json).
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pipeline_checks keeps an unused `w_status`; it is harmless, and editing the line would move mutation anchors in the
# validator. (F402 was ignored here for a loop variable named `field` in g_verdicts that shadowed dataclasses.field; the
# import moved to report.py with the Report class in PR-D0, so nothing is shadowed any more.)
"tools/vchlib/checks_trace.py" = ["F841"]      # pipeline_checks moved there in PR-D8

# Type checking is a ratchet (2026-11-22 review E7): `python -m mypy` must pass. Modules listed under ignore_errors are
# the ones that do not pass yet (the count of their errors on 2026-11-22 is in the comment); remove a module from the
# list when it is clean, never add one. tests/test_typing_ratchet.py keeps the list from growing.
[tool.mypy]
files = ["tools/vchlib"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "vchlib.checks",        # 175
    "vchlib.derive",        # 14
    "vchlib.verdict",       # 10
    "vchlib.calibration",   # 10
    "vchlib.expectations",  # 7
]
ignore_errors = true
