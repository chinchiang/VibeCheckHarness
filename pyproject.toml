[project]
name = "vibecheck-harness-design"
version = "0.5.0"
description = "VibeCheck Harness design repo: schemas, examples and the example validator (tools/vchlib)"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
  "cryptography>=43",
]

[project.optional-dependencies]
test = ["pytest>=8"]
reference = ["rfc8785==0.1.4"]   # RFC 8785 cross-check only; the validator warns (W-JCS-REFERENCE-MISSING) without it (r12 PR6)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
addopts = "-q"
