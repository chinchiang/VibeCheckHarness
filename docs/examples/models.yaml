# models.yaml — 模型登錄（示意）
# 模型 ID 與版本變動很快：實作時一律重新查證（見 docs/06 §3 第 15 條）。
# 規則：
#   - family / lineage 用來強制「驗證者與報告者不同家族、不同血統」。
#   - fallback 只能列同家族模型（tools/validate_schemas.py 會檢查）。
#   - data_classes 不含 C 的模型，不得收到機密程式碼（fail-closed）。
#   - litellm 仍是 <...> 佔位值的模型必須標 placeholder: true（validator 發出 W-MODEL-PLACEHOLDER）。

claude_sonnet:
  litellm: "anthropic/claude-sonnet-5"
  family: anthropic
  lineage: claude
  usable_ctx: 1000000          # [V] E:providers-23
  structured: claude_subset    # 無數值/長度限制、minItems 只能 0/1（[V] E:providers-25）
  data_classes: [P, C]         # C 級前提：組織層級保留/ZDR 設定已宣告並比對
  purpose: [production, evaluation]
  earliest_retirement: null
  pricing: null                # 價格未列出（實作時查證）；engagement 的 max_cost_usd 仍必填（fail-closed）
  rate_limits: null
  tokenizer: null
  fallback: [claude_opus_48]
  api: messages

claude_opus_48:
  # U-11 決定（2026-09-25）：取代 Claude Haiku 4.5（最早 2026-10-15 退役 [V][E:providers-49]）
  litellm: "anthropic/claude-opus-4-8"     # [V][E:providers-52]；legacy，仍為 Active
  family: anthropic
  lineage: claude
  usable_ctx: 1000000          # [V][E:providers-52]
  structured: claude_subset    # 沿用 Anthropic structured outputs 的限制 [H]；M2 manual 線確認
  data_classes: [P, C]
  purpose: [production, evaluation]
  earliest_retirement: "2027-05-28"        # 最早退役日 [V][E:providers-52]
  pricing: null
  rate_limits: null
  tokenizer: null
  fallback: []
  api: messages

gpt_flagship:
  # U-12 決定（2026-09-25）：GPT-6 Sol
  litellm: "openai/gpt-6-sol"  # [V][E:providers-46]
  family: openai
  lineage: gpt
  usable_ctx: 1050000          # [V][E:providers-46]
  structured: openai_strict    # additionalProperties:false、全部欄位 required（[V] E:providers-32）
  data_classes: [P, C]
  purpose: [production, evaluation]
  earliest_retirement: null
  pricing: null
  rate_limits: null
  tokenizer: null
  fallback: []
  api: responses               # Sol 在 Chat Completions 只有 reasoning_effort=none 才能 function calling；Responses 無此限制（[P] E:providers-47）
  store: false                 # C 級強制 store=false（[V] E:providers-34）

gpt_oss_self:
  litellm: "hosted_vllm/openai/gpt-oss-120b"
  api_base: "http://z4-gpt-oss:8000/v1"
  family: openai
  lineage: gpt-oss             # 與 gpt 不同血統，但同家族：不能驗證 gpt_flagship 的發現項
  usable_ctx: 128000           # 假設值，實作時依模型卡確認
  structured: vllm_json_schema
  data_classes: [P, C]
  purpose: [production, evaluation]
  earliest_retirement: null
  pricing: null
  rate_limits: null
  tokenizer: null
  fallback: []
  api: chat_completions

nemotron_self:
  litellm: "hosted_vllm/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"   # S-10
  api_base: "http://z4-nemotron:8000/v1"
  family: nvidia
  lineage: nemotron3
  usable_ctx: 256000           # HF 設定預設 256K（[V] E:providers-05）
  structured: vllm_json_schema # 注意：LiteLLM hosted_vllm 會移除 tools 的 strict（[C] E:providers-22）→ 用戶端 Pydantic 再驗證
  data_classes: [P, C]
  purpose: [production, evaluation]
  earliest_retirement: null
  pricing: null
  rate_limits: null
  tokenizer: null
  fallback: []
  api: chat_completions

nemotron_cloud:
  litellm: "nvidia_nim/<nemotron-3-super 模型名，實作時確認>"
  placeholder: true            # 模型名待確認；validator 發出 W-MODEL-PLACEHOLDER
  family: nvidia
  lineage: nemotron3
  usable_ctx: 256000           # 保守值；以同等性單位為準
  structured: unconfirmed      # 託管端點的 json_schema 支援未確認
  data_classes: [P]            # NVIDIA API Trial Terms：禁止機密資訊（[V] E:providers-10）
  purpose: [evaluation, prototyping]   # 禁止正式用途；不當成常駐預設驗證者
  earliest_retirement: null
  pricing: null
  rate_limits: null
  tokenizer: null
  fallback: []
  api: chat_completions
  notes: "只用於評估與原型，且只限公開或合成程式碼"
