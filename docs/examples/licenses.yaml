# licenses.yaml — 元件授權登錄（示意，licenses.schema.json；docs/06 §2.3）
# CI 規則（tools/validate_schemas.py 檢查）[H]：
#   - requirements.txt 的每個套件都要有一列（名稱小寫比對）
#   - tools.yaml 每個工具的 license_ref 都要有一列
#   - status＝法務閘門 必須寫 gate_milestone；ROE 啟用該元件時 legal_review.scope.component_licenses 必須為 true（L-6）
# 授權事實都是轉述，以 docs/06 §2.3 與其證據為準；evidence 引用證據帳本 ID（已獨立查核）。

registry_version: 1

components:
  # ---------- 驗證工具（requirements.txt）----------
  - {component: jsonschema, license: MIT, obligation: "保留授權聲明", usage: validator_runtime, status: OK, gate_milestone: null, evidence: ["E:orchestration-40"]}
  - {component: pyyaml, license: MIT, obligation: "保留授權聲明；解析陷阱見 docs/06 §1.6（驗證程式用嚴格載入器）", usage: validator_runtime, status: OK, gate_milestone: null, evidence: ["E:orchestration-40"]}
  - {component: tzdata, license: Apache-2.0, obligation: "保留 NOTICE", usage: validator_runtime, status: OK, gate_milestone: null, evidence: ["E:orchestration-40"]}
  - {component: cryptography, license: "Apache-2.0 OR BSD-3-Clause", obligation: "保留授權聲明", usage: validator_runtime, status: OK, gate_milestone: null, evidence: ["E:orchestration-46"]}
  - {component: rfc8785, license: Apache-2.0, obligation: "發布頻率低：固定版本 0.1.4，並以 RFC 8785 測試向量交叉比對", usage: validator_runtime, status: 注意, gate_milestone: null, evidence: ["E:orchestration-45"]}
  - {component: pytest, license: MIT, obligation: "保留授權聲明", usage: validator_test, status: OK, gate_milestone: null, evidence: ["E:whitebox-54"]}

