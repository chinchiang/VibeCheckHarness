# engagement.yaml — 委任設定（示意，engagement.schema.json）
# G0a：在 W0 之前驗章。任何把程式碼送往 LLM、或在 Z2 執行程式碼的步驟，都要先通過這份設定的驗證。
# 資料等級未填時視為 C（fail-closed）。
# 簽署人只能引用 key-registry.yaml 中的人（D11）；公鑰只從金鑰登錄取得。
# 簽章：Ed25519 over JCS（RFC 8785），簽署內容＝整份文件去掉 signatures（D11；tools/vchlib/canonical.py）。
# TEST ONLY：簽章由 tests/fixtures/TEST_ONLY_private_keys/ 的測試金鑰產生（tools/sign_examples.py）。

engagement_id: eng-acme-invoices-2026q4
version: 1
purpose: "ACME 發票系統的白箱＋黑箱安全驗證"
issued_at: "2026-09-18T10:00:00+08:00"
key_registry_ref: "docs/examples/key-registry.yaml"   # 必須等於 toolkit.yaml key_registry.location

run_owner: alice              # 自動觸發（schedule／merge）時的紀錄發起者；必須是登錄中的人
budget_approver: null         # null＝GB 由 run_owner 核准

code_ownership:
  repositories:
    - url: "https://git.example.com/acme/invoices"
      owner: "ACME Inc."
  attested_by:
    person_id: frank
    role: app_owner
    key_fingerprint: "ed25519:SHA256:jxVczmwwV1UVWwc1NkHUt22Xr+cvAoyjbxumX4TLJE0"
  attestation: true

data_class: C

allowed_models:            # 每個資料等級允許的模型（對應 models.yaml 的 key）
  P: [claude_sonnet, claude_opus_48, gpt_flagship, gpt_oss_self, nemotron_self, nemotron_cloud]
  C: [claude_sonnet, claude_opus_48, gpt_flagship, gpt_oss_self, nemotron_self]

lane_a_model: claude_opus_48  # Lane A 單一家族 diff 審查（結果最高 UNCORROBORATED）
owasp_llm_version: null       # null＝沿用 toolkit.yaml owasp_llm_default（2026）

telemetry_disabled: true
retention_days: 30

validity:
  not_before: "2026-09-20T00:00:00+08:00"
  not_after: "2026-10-31T23:59:59+08:00"

budgets:                      # docs/03 §11；費用上限必填
  run_total: {max_input_tokens: 30000000, max_output_tokens: 3000000, max_cost_usd: 400, max_compute_minutes: 2880}
  W: {max_input_tokens: 15000000, max_output_tokens: 1500000, max_cost_usd: 150, max_compute_minutes: 1440}
  B: {max_input_tokens: 5000000, max_output_tokens: 500000, max_cost_usd: 50, max_compute_minutes: 1440}
  families:                   # v0.5（BL-14）：每家族的 USD 上限；沒有列出的家族等於所在階段的上限
    anthropic: {max_cost_usd: 120}
    openai: {max_cost_usd: 60}
  price_assumptions:          # 第十三輪外部審查（docs/08 §11.12）：price 未知的雲端模型要有保守單價上界才可用（E-ENG-PRICING）
    claude_sonnet: {input_usd_per_mtok: 6, output_usd_per_mtok: 30, source: "假設上界（Opus 4.8 公告價 ×1.2，E:providers-52）；pilot 前查證"}
    claude_opus_48: {input_usd_per_mtok: 6, output_usd_per_mtok: 30, source: "假設上界（公告價 $5／$25 ×1.2，E:providers-52）；pilot 前查證"}
    gpt_flagship: {input_usd_per_mtok: 10, output_usd_per_mtok: 40, source: "假設上界；pilot 前查證（E:providers-46 未列價格）"}

publishing:                   # v0.5（BL-17）：PR／issue 回饋預設關閉（docs/08 §11.16）
  enabled: false
  platform: null
  token_scopes: []

gate_timeouts_hours:          # 只能比 toolkit.yaml 短
  claim_run: 168
  G1: 168
  G2: 168
  G3: 168
  G4: 72
  G5: 24
  GB: 24

signatories:
  - person_id: frank
    role: app_owner
    key_fingerprint: "ed25519:SHA256:jxVczmwwV1UVWwc1NkHUt22Xr+cvAoyjbxumX4TLJE0"
  - person_id: carol
    role: management
    key_fingerprint: "ed25519:SHA256:raVQ7so30NzKYQXvVVAC60cao19GTQKdsz1Xbu2O170"

gate_approvers:               # 白箱關卡（ROE 生效前）的核准者；G0b／G3／G4／G5 的核准者來自 roe.yaml
  G0a: [frank, carol]
  G1: [frank]
  G2: [erin, heidi]

providers:                    # 能收到 C 級資料的雲端模型：ZDR 已確認且 DPA 已簽；自架模型（Z4）不需要（E-ENG-PROVIDER）
  - {family: anthropic, zdr: confirmed, zdr_evidence_ref: "doc:zdr-anthropic-2026-09", dpa_signed: true, retention_days: null, region: US}
  - {family: openai, zdr: confirmed, zdr_evidence_ref: "doc:zdr-openai-2026-09", dpa_signed: true, retention_days: null, region: US}
  - {family: nvidia, zdr: not_available, zdr_evidence_ref: null, dpa_signed: false, retention_days: null, region: null}   # 只用自架 Nemotron；雲端 NIM 只收 P

data_transfer:                # v0.4：G0a 驗章的跨境聲明（W2 在 G0b 之前就把程式碼送往雲端模型，E-ENG-TRANSFER）
  source_jurisdiction: TW
  attested_by: carol          # 必須是本委任設定的簽署人
  transfers:                  # 每個能收 C 級資料的雲端家族一筆；自架（Z4）的 nvidia 不需要
    - {family: anthropic, region: US, mechanism: contract, reference: "doc:dpa-anthropic-2026-09#cross-border"}
    - {family: openai, region: US, mechanism: contract, reference: "doc:dpa-openai-2026-09#cross-border"}

config_pins:                  # v0.4：影響安全判斷的設定檔內容 hash（E-ENG-CONFIG-PIN）；改設定就要重簽委任設定
  models: "sha256:dda12dc5f12ec65008fb87bad5c5d04f5195db742db95a6e6dc2742a008acf43"
  agents: "sha256:9cc620a479bab648981166b6244be329afbd337dd7cfb8269eff482cbeef19dd"
  tools: "sha256:7232c12696bc144a7a88452c7ffcc90f998401c9b105966f70d677a40a6a13a6"
  calibration: "sha256:f005dc85cb352a9ba6407702f2d4a92ed7d90b49d693043190559b7846f8ed1c"   # v0.5
  crosswalk: "sha256:865d77a32541ebe394671103092781f2d672d8b1d74fd6bbe4d662fc91fc7b13"     # v0.5
  licenses: "sha256:dc6f7c0fb8f1e7e895610d28778e8e3d2da7d2abfbf9e238443f127fdb4f48dc"
  toolkit: "sha256:143294486e4cf2129db888a3f04c565b4f2bedcbc281fd82a1aa034c4ead0a66"      # v0.7（審查 r8 M1）

assurance_profile: team       # lite／team／full（docs/03 §6）；team：ROE 每個簽署角色由不同人擔任
role_consolidation: null      # 只在 lite 使用：同一人兼任多個角色時的聲明

